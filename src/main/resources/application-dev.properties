spring.config.activate.on-profile=dev
server.port=8080

# DataSource setting (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowra}
spring.datasource.username=${DB_USER:knowra}
spring.datasource.password=${DB_PASSWORD:knowra}

#JPA setting
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Upload Path
File.Store.Path=C:/home/upload

#Page config
Globals.pageUnit=10
Globals.pageSize=10

spring.thymeleaf.cache=false

# Redis — dev 는 로컬 컨테이너를 쓴다. 원격을 보면 조회수 동기화 스케줄러가 10분마다 실패한다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# 15=조회수·토큰차단, 14=피드 캐시(FeedCacheService 가 redisTemplate14 빈을 이름으로 찾는다).
# 여기서 14 를 빼면 피드 요청마다 NoSuchBeanDefinitionException 이 난다.
Globals.redis.dataBase=${REDIS_DATABASES:15,14}

# Flyway — 스키마의 단일 소유자. V1 이 6개 스키마를 직접 만든다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT — dev 기본값은 로컬 전용이다. 운영 값은 반드시 환경변수로 주입한다.
# 기본값을 두지 않는다 — 이 저장소는 공개라 기본값은 누구나 안다. 빠뜨리면 기동이 실패해야 한다.
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# 비밀값(2단계 인증 키) 암호화 키 — base64 32바이트(openssl rand -base64 32). 기본값 없음: 빠뜨리면 기동 실패.
# ⚠️ 잃으면 저장된 2단계 인증 키를 되살릴 수 없다(그 사람들은 복구 코드로만 들어온다). 따로 보관할 것.
knowra.crypto.secret-key=${TOTP_ENC_KEY}

# Gemini — dev 에는 키를 두지 않는다. 쓰려면 GEMINI_API_KEY 를 환경변수로 준다.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash-lite}
