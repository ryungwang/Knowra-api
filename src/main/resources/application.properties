# 주의: 키는 profiles(복수)다. profile 로 적으면 조용히 무시돼 프로파일이 아예 안 잡힌다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Jackson
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ── 피드 랭킹 ──────────────────────────────────────────────────────────
# 네 축을 [0,1] 로 정규화한 뒤 곱하므로 가중치가 곧 그 축의 상한 지분이다.
# 합은 반드시 1.0 — 기동 시 FeedRankingProperties 가 검증한다.
knowra.feed.ranking.weight-interest=0.18
knowra.feed.ranking.weight-relation=0.29
knowra.feed.ranking.weight-quality=0.29
knowra.feed.ranking.weight-freshness=0.24
# 각 원점수가 1.0 에 수렴하기 시작하는 지점. 원칙적으로 그 원점수의 p95 이며,
# 지금 값은 합성 시드 기준의 출발점이다 (재보정 쿼리: docs/feed-ranking.md §7).
knowra.feed.ranking.interest-ref=10.0
knowra.feed.ranking.relation-ref=20.0
knowra.feed.ranking.quality-rate-ref=20.0
# 품질 반응률 분모의 바닥(시간). 없으면 갓 올라온 글이 0으로 나뉘어 영구 1등이 된다.
knowra.feed.ranking.quality-prior-hours=4.0
# 신선도 반감기(시간). 토론형이면 늘리고 속보형이면 줄인다.
knowra.feed.ranking.fresh-half-life-hours=24.0
# 탐험 슬롯 — 몇 건마다 1건을 '한 번도 엮인 적 없는' 글에 배정할지 (0 이하면 끔).
# 10 = 50건 한 페이지에 5건. 하한이라 이미 낯선 글이 충분하면 아무 일도 안 한다.
knowra.feed.ranking.explore-slot-every=10

# 업로드 용량.
# ⚠️ 설정이 없으면 Spring Boot 기본값인 **파일당 1MB / 요청당 10MB** 가 적용된다.
# 커뮤니티에 올리는 이미지가 장당 1~2MB 라 기본값으로는 첫 장부터 거절된다
# (스킨 공모전처럼 12장 + 배경을 한 번에 올리는 경우를 받으려고 올렸다).
# 디스크에 원본 그대로 저장하므로(FileUtil — 리사이즈 없음) 저장 용량도 같이 본다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 콘텐츠 자동 생성에서 **제외할 커뮤니티**(commSn 쉼표 구분).
# ⚠️ 사람의 제출물을 받아 심사하는 자리(스킨 공모전 등)는 반드시 여기 넣는다 —
# 참가자 글에 AI 가 만든 좋아요·댓글이 붙으면 채택 과정의 공정성 시비가 된다.
# 비워 두면 아무것도 제외하지 않는다(기존 동작).
knowra.content-generation.excluded-communities=
