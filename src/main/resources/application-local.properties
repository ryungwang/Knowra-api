spring.config.activate.on-profile=local
server.port=8080

# DataSource setting (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowra}
spring.datasource.username=${DB_USER:knowra}
spring.datasource.password=${DB_PASSWORD:knowra}

#JPA setting
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Upload Path
File.Store.Path=C:/home/upload

#Page config
Globals.pageUnit=10
Globals.pageSize=10

spring.thymeleaf.cache=false

# JWT
# 로컬 전용 고정값. prod 는 환경변수를 강제한다(기본값 없음).
jwt.secret=knowra-secret-key-must-be-at-least-32-characters-long
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Gemini API (https://aistudio.google.com)
# ⚠️ 실제 키를 여기 적지 않는다 — 공개 저장소다(application-prod 헤더 참고).
# 로컬에선 비워 둬도 기동된다. 콘텐츠 생성을 돌릴 때만 환경변수로 넣는다.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash-lite
content.generation.cron=0 0 */1 * * *

# Redis — local 도 로컬 컨테이너를 쓴다. 데이터소스만 로컬로 바꾸고 Redis 를 원격에 두면 반쪽이다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# 15=조회수·토큰차단, 14=피드 캐시(FeedCacheService 가 redisTemplate14 빈을 이름으로 찾는다).
# 여기서 14 를 빼면 피드 요청마다 NoSuchBeanDefinitionException 이 난다.
Globals.redis.dataBase=${REDIS_DATABASES:15,14}

# Flyway — 스키마의 단일 소유자. V1 이 6개 스키마를 직접 만든다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 메일·문자 — 로컬은 보내지 않는다(dry-run). 코드는 서버 로그와 응답 devCode 로 본다.
# 운영에서 expose-code 를 켜면 인증이 무의미해진다. 여기(local)에만 둔다.
knowra.mail.enabled=false
knowra.sms.provider=none
knowra.verify.expose-code=true
knowra.front.base-url=http://localhost:5111

# 소셜 로그인 — 키는 환경변수로만. 비어 있으면 그 제공자 버튼이 안 보인다(/api/auth/sns/providers).
# 리다이렉트 URI 는 서버가 knowra.front.base-url + /auth/{provider}/callback 으로 만든다 — 제공자 콘솔에 그대로 등록.
knowra.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
knowra.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
knowra.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
knowra.oauth.naver.client-id=${NAVER_CLIENT_ID:}
knowra.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
knowra.oauth.apple.client-id=${APPLE_CLIENT_ID:}
