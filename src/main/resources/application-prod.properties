# ⚠️ **비밀값을 이 파일에 적지 않는다.**
#
# 이 저장소는 공개돼 있고, 2026-03 부터 7개월간 jwt.secret · gemini.api.key ·
# redis 비밀번호가 평문으로 커밋돼 있었다. 파일을 고쳐도 히스토리에 남으므로
# 그 키들은 전부 폐기·재발급 대상이다.
#
# 기본값을 두지 않는 것도 의도다 — 환경변수를 빠뜨리면 **기동이 실패해야** 한다.
# 빈 기본값({${DB_PASSWORD:}} 같은)은 비밀번호 없이 조용히 떠서 더 위험하다.
#
# 필요한 환경변수: DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
#                 JWT_SECRET GEMINI_API_KEY REDIS_HOST REDIS_PORT REDIS_PASSWORD
#                 FRONT_BASE_URL MAIL_HOST MAIL_PORT MAIL_USER MAIL_PASSWORD MAIL_FROM
#                 (문자 인증을 켜면) SMS_API_KEY SMS_API_SECRET SMS_FROM
#                 (소셜 로그인 — 비우면 그 버튼이 안 보인다) GOOGLE_CLIENT_ID KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET
#                 NAVER_CLIENT_ID NAVER_CLIENT_SECRET APPLE_CLIENT_ID  ※ 기존 VITE_GOOGLE_CLIENT_ID 는 서버 GOOGLE_CLIENT_ID 로 옮긴다
#                 (웹 푸시 — 비우면 꺼진다) VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT
spring.config.activate.on-profile=prod
server.port=8080

# DataSource setting (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:knowra}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

#JPA setting
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
# 운영은 SQL 을 찍지 않는다 — 로그에 개인정보·검색어가 남고 디스크를 먹는다
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Upload Path
File.Store.Path=/app/upload

#Page config
Globals.pageUnit=10
Globals.pageSize=10

spring.thymeleaf.cache=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Gemini API (https://aistudio.google.com)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.0-flash-lite
content.generation.cron=0 0 */1 * * *

#Redis Setting
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
Globals.redis.dataBase=15,14

# Flyway — 스키마의 단일 소유자. V1 이 6개 스키마를 직접 만든다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# CORS/쿠키 — 운영값. 프론트 도메인은 환경변수로.
knowra.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
knowra.auth.cookie-secure=true

# 메일 — 가입 인증 코드 · 비밀번호 재설정. SMTP 값은 전부 환경변수.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
knowra.mail.enabled=true
knowra.mail.from=${MAIL_FROM}
# 문자 — 기본은 꺼짐(none). Solapi 를 쓰려면 provider=solapi 와 키 3종을 넣는다.
knowra.sms.provider=${SMS_PROVIDER:none}
knowra.sms.api-key=${SMS_API_KEY:}
knowra.sms.api-secret=${SMS_API_SECRET:}
knowra.sms.from=${SMS_FROM:}
# 재설정 링크가 가리킬 프론트 주소
knowra.front.base-url=${FRONT_BASE_URL}

# 소셜 로그인 — 비어 있으면 그 제공자 버튼이 안 보인다. 애플 client-id 는 Services ID.
knowra.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
knowra.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
knowra.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
knowra.oauth.naver.client-id=${NAVER_CLIENT_ID:}
knowra.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
knowra.oauth.apple.client-id=${APPLE_CLIENT_ID:}

# 웹 푸시 — 키가 없으면 푸시를 끈다(토글이 안 보인다). ⚠️ 키를 바꾸면 기존 구독이 전부 무효.
# 키 만들기: npx web-push generate-vapid-keys (공개·개인 모두 base64url)
knowra.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
knowra.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
knowra.push.vapid.subject=${VAPID_SUBJECT:mailto:admin@knowra.app}
