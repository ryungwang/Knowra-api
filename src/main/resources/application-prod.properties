# ⚠️ **비밀값을 이 파일에 적지 않는다.**
#
# 이 저장소는 공개돼 있고, 2026-03 부터 7개월간 jwt.secret · gemini.api.key ·
# redis 비밀번호가 평문으로 커밋돼 있었다. 파일을 고쳐도 히스토리에 남으므로
# 그 키들은 전부 폐기·재발급 대상이다.
#
# 기본값을 두지 않는 것도 의도다 — 환경변수를 빠뜨리면 **기동이 실패해야** 한다.
# 빈 기본값({${DB_PASSWORD:}} 같은)은 비밀번호 없이 조용히 떠서 더 위험하다.
#
# 필요한 환경변수: DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
#                 JWT_SECRET GEMINI_API_KEY REDIS_HOST REDIS_PORT REDIS_PASSWORD
spring.config.activate.on-profile=prod
server.port=8080

# DataSource setting (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:knowra}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

#JPA setting
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Upload Path
File.Store.Path=/app/upload

#Page config
Globals.pageUnit=10
Globals.pageSize=10

spring.thymeleaf.cache=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Gemini API (https://aistudio.google.com)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.0-flash-lite
content.generation.cron=0 0 */1 * * *

#Redis Setting
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
Globals.redis.dataBase=15,14

# Flyway — 스키마의 단일 소유자. V1 이 6개 스키마를 직접 만든다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
