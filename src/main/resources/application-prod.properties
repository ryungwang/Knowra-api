spring.config.activate.on-profile=prod
server.port=8080

# DataSource setting (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:knowra}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

#JPA setting
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Upload Path
File.Store.Path=/app/upload

#Page config
Globals.pageUnit=10
Globals.pageSize=10

spring.thymeleaf.cache=false

# JWT
jwt.secret=knowra-secret-key-must-be-at-least-32-characters-long
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Gemini API (https://aistudio.google.com)
gemini.api.key=AIzaSyB92sadpWJM8IDG5Q1R2_6wV8oC3t1EejA
gemini.model=gemini-2.0-flash-lite
content.generation.cron=0 0 */1 * * *

#Redis Setting
spring.data.redis.host=121.186.165.80
spring.data.redis.port=6379
spring.data.redis.password=hanker
Globals.redis.dataBase=15,14

# Flyway — 스키마의 단일 소유자. V1 이 6개 스키마를 직접 만든다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
